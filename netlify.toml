# Netlify deploy config for the Everest ALT backend.
# Static UI is served from public/; the API runs as a serverless function
# backed by Netlify Blobs (durable storage, no extra account).

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install --include=dev --no-audit --no-fund && npm run build:gallery"

# API -> function (rewrite keeps the original /api/... path in rawUrl).
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/api/oauth/metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/api/oauth/resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/api/oauth/resource"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Home = the vision homepage; /app = the account & setup flow.
[[redirects]]
  from = "/"
  to = "/everestalt.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/grok-chat.html"
  status = 200

[functions]
  external_node_modules = ["@netlify/blobs"]

